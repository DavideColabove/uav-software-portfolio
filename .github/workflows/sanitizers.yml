name: Memory & Thread Safety

on: [push, pull_request]

jobs:
  dynamic-sanitizers:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Compilazione con ${{ matrix.sanitizer }} Sanitizer
        run: |
          mkdir build && cd build
          cmake -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -g" ..
          make
      - name: Test a runtime
        run: |
            cd build/out
            for nodo in *; do
                    if [ -f "$nodo" ] && [ -x "$nodo" ]; then
                    echo ">>> Dynamic test on node: $nodo"
                    ./"$nodo"
                    fi
                done

  static-analysis:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Installa Clang-Tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Esegui Clang-Tidy
        run: clang-tidy 01_cpp_robotics/concurrency/src/*.cpp 01_cpp_robotics/memory_management/src/*.cpp -- -std=c++17